
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Price Prediction</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'properties/style.css' %}">
</head>

<body>

    <div class="container">

        <h1>🏠 Property Price Prediction</h1>

        <p>Enter the property details to estimate its market price.</p>

        <form method="POST" class="prediction-form">

            {% csrf_token %}

            <label>City</label>
            <select name="city" required>
                <option value="Kathmandu">Kathmandu</option>
                <option value="Lalitpur">Lalitpur</option>
                <option value="Bhaktapur">Bhaktapur</option>
            </select>

            <label>Area (sq.ft)</label>
            <input type="number" name="area" step="0.01" required>

            <label>Bedrooms</label>
            <input type="number" name="bedroom" min="0" required>

            <label>Bathrooms</label>
            <input type="number" name="bathroom" min="0" required>

            <label>Floors</label>
            <input type="number" name="floors" min="0" required>

            <label>Parking</label>
            <input type="number" name="parking" min="0" required>

            <label>Road Width (feet)</label>
            <input type="number" name="road_width" step="0.01" required>

            <label>Property Age</label>
            <input type="number" name="property_age" min="0" required>

            <label>Face</label>
            <select name="face" required>
                <option value="East">East</option>
                <option value="West">West</option>
                <option value="North">North</option>
                <option value="South">South</option>
            </select>

            <label>Road Type</label>
            <select name="road_type" required>
                <option value="Blacktopped">Blacktopped</option>
                <option value="Gravelled">Gravelled</option>
                <option value="Soil Stabilized">Soil Stabilized</option>
            </select>

            <label>Amenities Count</label>
            <input type="number" name="amenity_count" min="0" required>

            <button type="submit">Predict Price</button>

        </form>

        {% if prediction %}
            <div class="prediction-result">
                <h2>Estimated Property Price</h2>
                <h1>Rs. {{ prediction }}</h1>
            </div>
        {% endif %}

    </div>

</body>
</html>
